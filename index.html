<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Shift & Pay Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Swiss Shift & Pay Tracker</h1>
    <div class="shiftSpace">
        <div>     
            <div class="inputGroup">
                <label for="dateInput">Date</label>
                <input type="text" placeholder="Date" id="dateInput">
            </div>

            <div class="inputGroup">
                <label for="startTimeInput">Start Time</label>
                <input type="text" placeholder="Start Time" id="startTimeInput">
            </div>

            <div class="inputGroup">
                <label for="endTimeInput">End Time</label>
                <input type="text" placeholder="End Time" id="endTimeInput">
            </div>

            <div class="inputGroup">
                <label for="breakInput">Break</label>
                <input type="text" placeholder="Break" id="breakInput">
            </div>
        </div>

        <div class="inputGroup">
            <label for="hourlyWageInput">Hourly Wage</label>
            <input type="text" placeholder="Hourly Wage" id="hourlyWageInput">
        </div>

        <div class="inputGroup">
            <label for="shiftInput">Shift</label>
            <input type="text" placeholder="Shift" id="shiftInput">
            <button>Add Shift</button>
        </div>
    </div>
    <div class="outputSpace">
        <div class="outputGroup">
            <h6>Shift List</h6>
            <div id="shiftListOutput"></div>
        </div>
        <div class="outputGroup">
            <h2>Summary</h2>
            <p>Total Hours: <span id="totalHours">0</span></p>
            <p>Total Pay: CHF <span id="totalPay">0.00</span></p>
        </div>
        <div class="outputGroup">
            <h6>Monthly Total</h6>
            <p id="monthlyTotal">CHF 0.00</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
